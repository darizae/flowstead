# Flowstead public-demo hosted fallback on the owner's existing x86_64 VM.
# Both API and worker use DIFFERENT restricted Postgres role secrets.
# Do not put an owner/migration password in either host env file.
# No local PostgreSQL. NATS only uses private internal ports.
# This is an optional Docker fallback; native systemd services are preferred
# on the memory-limited E2 micro.
#
# Required settings (two different root-protected files):
# HOSTED_API_ENV_FILE=/etc/flowstead/api.env
# HOSTED_WORKER_ENV_FILE=/etc/flowstead/worker.env

x-backend: &backend
  image: flowstead-backend:amd64-hosted
  # Public CA only; runtime secrets remain per-service env_file.
  volumes:
    - ${HOSTED_CA_FILE:-/etc/flowstead/supabase-root-2021.crt}:/etc/flowstead/supabase-root-2021.crt:ro
  depends_on:
    nats:
      condition: service_healthy
  networks:
    - internal
  restart: unless-stopped

services:
  nats:
    image: nats:2.12-alpine@sha256:b270f5e2428354c0335612694d7dd2fb588148e567a5757fdff325ef9c9332e6
    # JetStream enabled with a persistent, host-owned data directory. Stream
    # retention is bounded by the app (7-day max event age, 5-delivery retry);
    # restarting NATS or the host preserves the durable queue.
    command: ["-c", "/etc/nats/nats.conf"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8222/healthz?js-enabled-only=true' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - flowstead-nats:/data
      - ./deploy/oci/nats-docker.conf:/etc/nats/nats.conf:ro
    secrets:
      - source: nats_auth
        target: /etc/nats/nats-auth.conf
        mode: 0444
    networks:
      - internal
    # Never publish 4222/8222 to the host.

  api:
    <<: *backend
    env_file:
      - ${HOSTED_API_ENV_FILE:?set API-only credentials file}
    command: ["uvicorn", "flowstead_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    stop_grace_period: 30s
    # Never publish 8000 to the host; only the proxy terminates client TLS.

  worker:
    <<: *backend
    env_file:
      - ${HOSTED_WORKER_ENV_FILE:?set worker-only credentials file}
    command: ["python", "-m", "flowstead_api.messaging", "run"]
    # Process-alive probe; DB/JetStream reachability is asserted by the hosted
    # smoke (queue → forecast completion), not by an HTTP endpoint.
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; open('/proc/1/stat').read()"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    # A durable consumer must drain before exit on SIGTERM; the default 10s
    # stop timeout would SIGKILL it and abort an in-flight forecast ack.
    stop_grace_period: 120s

  proxy:
    # HTTPS reverse proxy (Caddy, digest-pinned). Only this service is public.
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/oci/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - internal

networks:
  # Non-published bridge so api/nats/worker can reach Supabase/DATABASE_URL and
  # the JWKS issuer outbound while being unreachable from the host's public
  # interface. Do NOT toggle `internal: true` here: api/worker need outbound
  # egress to the hosted database and Auth issuer.
  internal:
    driver: bridge

secrets:
  nats_auth:
    file: ${HOSTED_NATS_AUTH_FILE:?set root-protected NATS token file}

volumes:
  flowstead-nats:
  caddy-data:
  caddy-config:

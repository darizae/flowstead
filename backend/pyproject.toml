[project]
name = "flowstead-backend"
version = "0.1.0"
description = "Flowstead local PostgreSQL backend and bounded synthetic importer"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "nats-py>=2.11,<3",
  "psycopg[binary]>=3,<4",
  "pydantic>=2,<3",
  "pyjwt[crypto]>=2.9,<3",
  "reportlab>=4,<5",
  "sqlalchemy>=2,<3",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.16,<2",
  "pytest>=8,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
pythonpath = ["..", "src"]
testpaths = ["tests"]

[tool.mypy]
# Targeted strict typing over the pure domain/application modules (audit #45).
# The domain and application logic are checked strictly; infrastructure and
# transport adapters are checked by their runtime and integration tests.
python_version = "3.12"
strict = true
files = [
  "src/flowstead_api/domain",
  "src/flowstead_api/forecast.py",
  "src/flowstead_api/application",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
py-modules = ["importer", "migrate"]
[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "flowstead-backend"
version = "0.1.0"
description = "Flowstead local PostgreSQL backend and bounded synthetic importer"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "nats-py>=2.11,<3",
  "psycopg[binary]>=3,<4",
  "pydantic>=2,<3",
  "pyjwt[crypto]>=2.9,<3",
  "sqlalchemy>=2,<3",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
pythonpath = ["..", "src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
py-modules = ["importer", "migrate"]
[tool.setuptools.packages.find]
where = ["src"]

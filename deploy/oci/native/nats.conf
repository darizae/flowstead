# Flowstead NATS JetStream: bounded durable storage, loopback only.
listen: 127.0.0.1:4222
http: 127.0.0.1:8222
# Required private token file. Never bind the broker on a public interface.
include ./nats-auth.conf
max_payload: 16384
jetstream {
  store_dir: "/var/lib/flowstead/nats"
  max_mem_store: 16MB
  max_file_store: 256MB
}

# Hosted Docker fallback: internal-only NATS with per-worker token auth.
# This is NOT the already-running native broker. Never run both on the micro.
listen: 0.0.0.0:4222
http: 127.0.0.1:8222
max_payload: 16384
jetstream {
  store_dir: "/data"
  max_mem_store: 16MB
  max_file_store: 256MB
}
# Secrets are injected as a Compose file secret, not part of the image or Git.
include ./nats-auth.conf

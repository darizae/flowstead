repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
        # Previously accepted acceptance evidence remains immutable; apply
        # this guard to new source/config additions rather than historical ZIPs.
        exclude: ^docs/design/evidence/
      - id: trailing-whitespace
        types: [text]
        exclude: ^(docs/|frontend/src/lib/api/generated/)
      - id: end-of-file-fixer
        types: [text]
        exclude: ^(docs/|frontend/src/lib/api/generated/)
  - repo: local
    hooks:
      - id: backend-ruff
        name: Backend Ruff lint
        entry: uv run --project backend ruff check backend/src backend/importer.py backend/migrate.py backend/tests
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: backend-format
        name: Backend Ruff formatting
        entry: uv run --project backend ruff format --check backend/src backend/importer.py backend/migrate.py backend/tests
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: frontend-lint
        name: Frontend lint and formatting
        entry: sh -c 'npm --prefix frontend run lint && npm --prefix frontend run format:check'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(tsx?|css|json)$
      - id: docs-links
        name: Documentation links
        entry: python3 scripts/docs_check.py
        language: system
        pass_filenames: false
        files: ^(docs/.*\.md|README\.md|AGENTS\.md|justfile)$

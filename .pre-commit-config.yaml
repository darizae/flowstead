repos:
  - repo: local
    hooks:
      - id: backend-ruff
        name: Backend Ruff lint
        entry: uv run --project backend ruff check backend/src backend/importer.py backend/migrate.py backend/tests
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: backend-format
        name: Backend Ruff formatting
        entry: uv run --project backend ruff format --check backend/src backend/importer.py backend/migrate.py backend/tests
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: frontend-lint
        name: Frontend lint and formatting
        entry: sh -c 'npm --prefix frontend run lint && npm --prefix frontend run format:check'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(tsx?|css|json)$
      - id: docs-links
        name: Documentation links
        entry: python3 scripts/docs_check.py
        language: system
        pass_filenames: false
        files: ^(docs/.*\.md|README\.md|AGENTS\.md|justfile)$
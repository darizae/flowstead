name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only checkout; no secrets referenced. Deploys are manual/outside CI.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --project backend --frozen
      - name: Ruff lint and format
        run: |
          python3 scripts/check_architecture.py
          uv run --project backend --frozen ruff check backend/src backend/importer.py backend/migrate.py backend/tests
          uv run --project backend --frozen ruff format --check backend/src backend/importer.py backend/migrate.py backend/tests
      - name: Run backend unit tests
        run: uv run --project backend pytest -q backend/tests/unit

  frontend:
    name: Frontend typecheck / unit / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
        working-directory: frontend
      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend
      - name: Lint and formatting
        run: |
          npm run lint
          npm run format:check
        working-directory: frontend
      - name: Unit tests
        run: npm test -- --run
        working-directory: frontend
      - name: Frontend coverage thresholds
        run: npm run test:coverage
        working-directory: frontend
      - name: Publish coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: ignore
          retention-days: 14
      - name: Build
        run: npm run build
        working-directory: frontend

  docs:
    name: Docs check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run docs check
        run: python3 scripts/docs_check.py

  backend-integration:
    name: Backend PostgreSQL and NATS integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowstead
          POSTGRES_PASSWORD: flowstead_local
          POSTGRES_DB: flowstead
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowstead -d flowstead"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://flowstead:flowstead_local@127.0.0.1:5432/flowstead
      NATS_URL: nats://127.0.0.1:4222
      FLOWSTEAD_ISOLATED_NATS_TEST: '1'
      FLOWSTEAD_M1_MANIFEST: ${{ github.workspace }}/backend/tests/fixtures/m1/manifest.json
      FLOWSTEAD_M1_DATA: ${{ runner.temp }}/flowstead-m1/telemetry.csv
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Start JetStream-enabled NATS
        run: docker run --detach --name flowstead-ci-nats -p 4222:4222 nats:2.12-alpine -js
      - name: Verify and unpack the pinned synthetic M1 fixture
        run: python3 scripts/prepare_m1_fixture.py --output "$FLOWSTEAD_M1_DATA"
      - run: uv sync --project backend --frozen
      - run: uv run --project backend --frozen pytest -q backend/tests/integration
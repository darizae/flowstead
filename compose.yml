services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flowstead}
      POSTGRES_USER: ${POSTGRES_USER:-flowstead}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flowstead_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - flowstead-postgres:/var/lib/postgresql/data

  nats:
    image: nats:2.12-alpine@sha256:b270f5e2428354c0335612694d7dd2fb588148e567a5757fdff325ef9c9332e6
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "127.0.0.1:${NATS_PORT:-42229}:4222"
      - "127.0.0.1:${NATS_MONITOR_PORT:-8229}:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8222/healthz?js-enabled-only=true' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - flowstead-nats:/data

volumes:
  flowstead-postgres:
  flowstead-nats:
